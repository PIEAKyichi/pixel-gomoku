<!-- public/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIXEL GOMOKU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ============ 大厅 ============ -->
    <section id="lobby" class="screen active">
      <div class="time-display" id="lobbyTime">----/--/-- --:--</div>
      <h1>五子棋</h1>
      <p class="subtitle">PIXEL GOMOKU</p>

      <div class="avatar-upload">
        <label for="avatarInput">
          <img id="avatarPreview" src="" alt="头像" style="display:none;">
          <div id="avatarPlaceholder">+ 上传头像</div>
        </label>
        <input type="file" id="avatarInput" accept="image/*" hidden>
      </div>

      <label class="field">
        <span>昵称</span>
        <input id="nameInput" maxlength="12" placeholder="玩家" autocomplete="off">
      </label>

      <div class="field">
        <span>创建房间</span>
        <div class="join-row">
          <input id="createRoomInput" maxlength="4" placeholder="自定义(可选)" autocomplete="off" style="text-transform: uppercase;">
          <button id="createBtn" class="btn-primary" style="flex:none; width:100px; background:var(--green);">创建</button>
        </div>
      </div>

      <label class="aihint-toggle">
        <input type="checkbox" id="aiHintInput">
        <span>允许 AI 提醒（房主开关）</span>
      </label>

      <div class="divider"><span>或者</span></div>

      <div class="field">
        <span>加入房间</span>
        <div class="join-row">
          <input id="roomInput" maxlength="4" placeholder="输入房间号" autocomplete="off" style="text-transform: uppercase;">
          <button id="joinBtn" style="flex:none; width:100px; background:var(--yellow);">加入</button>
        </div>
      </div>
      
      <p id="lobbyMsg" class="lobby-msg"></p>
    </section>

    <!-- ============ 对局 ============ -->
    <section id="game" class="screen">
      <div class="topbar">
        <span id="roomLabel" class="room-label">房间: ----</span>
        <span id="gameTime" class="time-display" style="font-size:14px">----/--/-- --:--</span>
        <div class="topbar-btns">
          <button id="restartBtn" class="hidden">再来一局</button>
          <button id="leaveBtn" class="btn-ghost">离开</button>
        </div>
      </div>

      <div class="main">
        <!-- 对弈区 -->
        <div class="game-vertical">
          <!-- 顶部玩家栏（对手在左，自己在右） -->
          <div class="players-top">
            <div class="player-zone opponent-zone">
              <div class="p-info" id="oppInfo">
                <img class="p-avatar" id="oppAvatar" src="">
                <div class="p-detail">
                  <div class="p-name" id="oppName">等待加入...</div>
                  <div class="p-time" id="oppTime">00:00</div>
                </div>
              </div>
              <div class="bubble hidden" id="oppBubble"></div>
            </div>

            <div class="player-zone me-zone">
              <div class="p-info" id="myInfo">
                <img class="p-avatar" id="myAvatar" src="">
                <div class="p-detail">
                  <div class="p-name" id="myName">我</div>
                  <div class="p-time" id="myTime">00:00</div>
                </div>
              </div>
              <div class="bubble hidden" id="myBubble"></div>
            </div>
          </div>

          <!-- 棋盘 -->
          <div class="board-container">
            <canvas id="board"></canvas>
          </div>
        </div>

        <!-- 聊天区 -->
        <div class="chat-area">
          <div class="history-panel">
            <div class="history-title">棋谱</div>
            <div class="history-list" id="historyList"></div>
          </div>
          <div class="messages" id="messages"></div>
          
          <div class="action-bar">
            <button id="undoBtn" class="btn-small">悔棋</button>
            <button id="drawBtn" class="btn-small">求和</button>
            <button id="resignBtn" class="btn-small">认输</button>
            <button id="aiHintBtn" class="btn-small hidden">AI 提醒</button>
          </div>

          <div class="chat-input-wrapper">
            <!-- 快捷消息菜单 -->
            <div id="quick-menu" class="hidden">
              <span class="quick-item" data-text="快点儿，我等到花都谢了">快点儿，我等到花都谢了</span>
              <span class="quick-item" data-text="我知道你很急，但你先别急">我知道你很急，但你先别急</span>
              <span class="quick-item" data-text="好棋，这把稳了！">好棋，这把稳了！</span>
              <span class="quick-item" data-text="太菜了，直接认输吧">太菜了，直接认输吧</span>
            </div>
            <form id="chatForm" class="chat-form" autocomplete="off">
              <input id="chatInput" maxlength="50" placeholder="说点什么..." autocomplete="off">
              <button type="submit">发送</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- 弹窗 -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <p id="modalText"></p>
        <div class="modal-btns">
          <button id="modalAccept" class="btn-primary">同意</button>
          <button id="modalReject" class="btn-ghost">拒绝</button>
        </div>
      </div>
    </div>

    <!-- 结算遮罩 -->
    <div id="gameoverModal" class="modal hidden">
      <div class="modal-content">
        <h2 id="resultTitle">游戏结束</h2>
        <p id="resultDesc" style="font-size: 18px; color: var(--yellow); margin: 20px 0;"></p>
        <button id="resultBtn" class="btn-primary">知道了</button>
      </div>
    </div>

    <!-- 猪头弹层 -->
    <div id="pigOverlay" class="pig-overlay hidden">
      <div class="pig-card">
        <svg class="pig-svg" viewBox="0 0 100 100" width="160" height="160" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="22" cy="32" rx="13" ry="17" fill="#ff9bb0" stroke="#2a1a22" stroke-width="3"/>
          <ellipse cx="78" cy="32" rx="13" ry="17" fill="#ff9bb0" stroke="#2a1a22" stroke-width="3"/>
          <ellipse cx="22" cy="34" rx="7" ry="10" fill="#e5738f"/>
          <ellipse cx="78" cy="34" rx="7" ry="10" fill="#e5738f"/>
          <ellipse cx="50" cy="55" rx="38" ry="34" fill="#ff9bb0" stroke="#2a1a22" stroke-width="3"/>
          <circle cx="37" cy="48" r="5" fill="#2a1a22"/>
          <circle cx="63" cy="48" r="5" fill="#2a1a22"/>
          <circle cx="39" cy="46" r="1.8" fill="#fff"/>
          <circle cx="65" cy="46" r="1.8" fill="#fff"/>
          <ellipse cx="50" cy="66" rx="15" ry="10" fill="#e5738f" stroke="#2a1a22" stroke-width="2.5"/>
          <ellipse cx="44" cy="66" rx="3.5" ry="4.5" fill="#2a1a22"/>
          <ellipse cx="56" cy="66" rx="3.5" ry="4.5" fill="#2a1a22"/>
          <path d="M50 77 Q50 84 43 81 M50 84 Q50 84 57 81" stroke="#2a1a22" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
        <p id="pigText" class="pig-text">真是个傻子</p>
      </div>
    </div>

    <!-- 断线重连遮罩 -->
    <div id="reconnectOverlay" class="reconnect-overlay hidden">
      <div class="reconnect-box">
        <p>连接断开，正在重连<span id="reconnectDots">…</span></p>
      </div>
    </div>

  </div>
  <script type="module" src="ai/index.mjs"></script>
  <script src="client.js"></script>
</body>
</html>
